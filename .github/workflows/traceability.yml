# Hosted fallback for the deterministic gates that need no game install:
# requirement coverage (hard) and the traceability quality audit (advisory).
#
# The traceable-reqs CLI is released from a private repo, so the default GITHUB_TOKEN cannot
# download it. Provide a repository secret TRACEABLE_REQS_TOKEN (a fine-grained PAT with read
# access to BigscreenVR/traceable-reqs releases) to enable this job; without it the job skips
# with a notice and the gate runs on the fleet host only (scripts/gates.ps1, docs/CI.md).
name: traceability
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect token
        id: token
        run: |
          if [ -n "${{ secrets.TRACEABLE_REQS_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TRACEABLE_REQS_TOKEN not set; traceability gate runs on the fleet host only (scripts/gates.ps1)."
          fi
      - name: Install traceable-reqs
        if: steps.token.outputs.present == 'true'
        run: |
          gh release download --repo BigscreenVR/traceable-reqs --pattern '*linux-x86_64' --output traceable-reqs
          chmod +x traceable-reqs
        env:
          GH_TOKEN: ${{ secrets.TRACEABLE_REQS_TOKEN }}
      - name: Coverage gate (hard)
        if: steps.token.outputs.present == 'true'
        run: ./traceable-reqs check --json
      - name: Quality audit (advisory)
        if: steps.token.outputs.present == 'true'
        run: ./traceable-reqs lint || true
